[package]
name = "demo.desktop"
version = "0.1.0"

# The windowed front end. It depends on the same three libraries the headless
# binary does, plus one crates.io crate consumed through the `rust.<crate>`
# interop form -- so a real desktop window costs one dependency line and no
# glue code.
[dependencies]
"demo.core" = { path = "../core" }
"demo.model" = { path = "../model" }
"demo.render" = { path = "../render" }
"rust.minifb" = "0.27"
