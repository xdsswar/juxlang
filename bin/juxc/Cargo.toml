[package]
name = "juxc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Jux compiler. Operates on individual files or modules."
build = "build.rs"

[[bin]]
name = "juxc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
juxc-driver      = { workspace = true }
juxc-source      = { workspace = true }
juxc-diagnostics = { workspace = true }
anyhow           = { workspace = true }
clap             = { workspace = true }

[dev-dependencies]
# The diagnostic-format tests check that `--diagnostic-format json` is JSON.
serde_json       = { workspace = true }
# `family_names.rs` generates a crate family's stubs from checked-in rustdoc
# JSON, the way the driver does for a real dependency.
juxc-bindgen     = { workspace = true }

# Embed Windows resources (icon + VERSIONINFO with product name,
# company, copyright, file/product version). Only active on the
# MSVC/mingw toolchain — `build.rs` is a no-op elsewhere.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
