[package]
name = "juxc-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Generates Jux-syntax interface stubs (.jux.d) from foreign APIs — per JUX-BINDGEN-ADDENDUM.md §G."

[lints]
workspace = true

[dependencies]
# Typed schema for `rustdoc --output-format json`, the source of truth for a
# Rust crate's public API (§G.6.1). Only the `ingest` module touches it; the
# rest of the crate works on the language-agnostic stub IR.
rustdoc-types = { workspace = true }
# Reads the rustdoc JSON file off disk.
serde_json    = { workspace = true }
# Reads the toolchain's library SOURCE for the inherent impls rustdoc JSON
# leaves out (`alloc`'s `impl<T> [T]` and `impl str`, §G.6.4.4). Parsing only:
# no proc-macro support or printing is needed.
syn           = { version = "2", default-features = false, features = ["full", "parsing", "clone-impls"] }
