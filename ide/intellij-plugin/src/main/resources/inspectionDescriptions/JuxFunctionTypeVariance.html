Reports a function value put in a function-typed slot the wrong way round (E0410). Parameters are contravariant and results covariant:
<code>(Animal) -&gt; R</code> fits a <code>(Dog) -&gt; R</code> slot and <code>() -&gt; Dog</code> fits <code>() -&gt; Animal</code>, but not the reverse.
