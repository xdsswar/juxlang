jux.var.types.name=Inferred types of var locals
jux.var.types.description=Shows the type a <code>var</code> local infers after its name, unless the initializer already spells it (a <code>new</code> expression, a literal or a cast).
jux.chain.types.name=Method chains
jux.chain.types.description=Shows the type each line of a call chain produces, when the chain has three calls or more written one per line and produces at least two different types.
